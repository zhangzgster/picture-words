<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看图说英语 · Picture Words</title><meta name="description" content="先看图，想一想，再揭晓单词。身体、衣服、鞋子和配饰的互动英语图卡。"><link rel="stylesheet" href="style.css"></head><body><header><a href="./" class="brand"><span class="logo">p<span>•</span></span>Picture Words<span class="brand-cn">看图说英语</span></a><span class="header-note">A little practice, every day.</span></header><main><section class="intro"><div class="eyebrow">LOOK. THINK. SAY.</div><h1>先看见，再说出来<span>。</span></h1><p>从身体到日常穿搭，让图像成为你的英语提示。</p><div class="steps"><span><b>01</b> 看图</span><i>→</i><span><b>02</b> 回忆单词</span><i>→</i><span><b>03</b> 点击揭晓 · 听发音</span></div><div class="hero-decor" aria-hidden="true"><span>👟</span><span>✦</span></div></section><section class="workspace"><nav id="categories" aria-label="词汇分类"></nav><div class="toolbar"><div><h2 id="sectionTitle"></h2><p id="subtitle"></p></div><div class="actions"><button id="shuffle">⇄ 随机排序</button><button id="reset">↺ 重新看图</button><button id="focus" class="dark">专注练习 ↗</button></div></div><div class="progress-line"><span id="progressLabel"></span><div class="track"><div id="progress"></div></div><label><input type="checkbox" id="unlearned"> 只看未掌握</label></div><div id="grid" class="grid"></div><p id="empty" hidden>这一组已经全部掌握了！取消「只看未掌握」即可复习。</p></section><footer><span>先回忆，再揭晓。给大脑一点思考的空间。</span><span>点击图卡揭晓 · 点击扬声器跟读</span></footer></main><dialog id="practice"><button id="close" class="close" aria-label="关闭练习">×</button><div class="eyebrow">FOCUS PRACTICE</div><h2>只专注眼前这一张</h2><p id="practiceCount"></p><div id="practiceCard"></div><div class="practice-nav"><button id="prev">← 上一个</button><button id="next">下一个 →</button></div><p class="keyhint">空格：揭晓 / 隐藏　← →：切换</p></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
